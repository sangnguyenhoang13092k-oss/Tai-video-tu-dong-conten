<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPTC 2027 Tool</title>
  <!-- Thư viện React, Babel, XLSX & Tailwind CSS -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    body { margin: 0; padding: 0; background-color: #f6f8fc; } button {cursor:pointer} button:disabled {cursor:not-allowed}
    .content-editor .template-token-ok { background:#d1fae5; color:#047857; font-weight:700; border-radius:3px; box-decoration-break:clone; }
    .content-editor .template-token-error { background:#fee2e2; color:#b91c1c; font-weight:700; border-bottom:1px solid #ef4444; border-radius:3px; box-decoration-break:clone; }
    .content-editor:focus {box-shadow:0 0 0 2px #e0e7ff;}
    .content-editor[contenteditable="false"] {opacity:.65;cursor:wait;}
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const Icon = ({ name, brand = false, className = '' }) => (
      <i className={`${brand ? 'fa-brands' : 'fa-solid'} fa-${name} fa-fw ${className}`} aria-hidden="true"></i>
    );

    const normalizeKeyStatic = str => String(str ?? '').normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();

    // Phân loại theo hostname thật, tránh đếm nhầm các chuỗi có chữ 'fb' / 'drive'.
    const platformOf = link => {
      try {
        const url = new URL(String(link || '').trim());
        if (!['https:', 'http:'].includes(url.protocol)) return 'invalid';
        const host = url.hostname.toLowerCase().replace(/^www\./, '');
        if (host === 'youtu.be' || host === 'youtube.com' || host === 'm.youtube.com' || host === 'youtube-nocookie.com') return 'social';
        if (host === 'tiktok.com' || host.endsWith('.tiktok.com')) return 'social';
        if (host === 'facebook.com' || host.endsWith('.facebook.com') || host === 'fb.watch' || host === 'fb.com') return 'social';
        if (host === 'drive.google.com') return 'drive';
        return 'other';
      } catch (_) { return 'invalid'; }
    };
    const socialKind = link => {
      try {
        const h = new URL(link).hostname.toLowerCase();
        if (/youtu\.be|youtube(-nocookie)?\.com/.test(h)) return 'youtube';
        if (h.includes('tiktok.com')) return 'tiktok';
        if (h.includes('facebook.com') || h === 'fb.watch' || h === 'fb.com') return 'facebook';
      } catch (_) {}
      return null;
    };
    const baseLinkProblem = item => {
      const link = String(item.link || '').trim();
      if (!link) return {kind:'missing', label:'Thiếu link', detail:'Chưa có liên kết video.'};
      if (platformOf(link) === 'invalid') return {kind:'invalid', label:'Link không hợp lệ', detail:'Cần đường dẫn http:// hoặc https:// hợp lệ.'};
      if (platformOf(link) === 'drive') {
        try {
          const u = new URL(link);
          if (u.pathname.includes('/folders/')) return {kind:'invalid', label:'Link thư mục', detail:'Đây là thư mục Drive, không phải tệp video.'};
          if (!/\/file\/d\/([\w-]{15,})/.test(u.pathname) && !(/^(open|uc)$/.test(u.pathname.replace(/^\//,'')) && /^[\w-]{15,}$/.test(u.searchParams.get('id')||'')))
            return {kind:'invalid', label:'Link Drive không đúng', detail:'Không tìm thấy ID tệp Google Drive.'};
        } catch (_) {return {kind:'invalid', label:'Link sai', detail:'Không đọc được link.'};}
      }
      if (socialKind(link) === 'youtube') {
        const u = new URL(link);
        const h = u.hostname.toLowerCase();
        const id = h.includes('youtu.be') ? u.pathname.split('/')[1] : (u.searchParams.get('v') || u.pathname.match(/\/(?:shorts|live|embed|v)\/([\w-]+)/)?.[1]);
        if (!id || !/^[\w-]{11}$/.test(id)) return {kind:'invalid', label:'Link YouTube không đúng', detail:'Không xác định được mã video YouTube.'};
      }
      return null;
    };
    const checkResultIsIssue = r => !!r && ['locked','broken','invalid','missing'].includes(r.kind);

    // Các trang có thể trả về lỗi CORS; lỗi CORS KHÔNG đồng nghĩa bị khóa.
    const checkOembed = async (link, platform) => {
      const url = platform === 'youtube'
        ? 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(link)
        : 'https://www.tiktok.com/oembed?url=' + encodeURIComponent(link);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 11000);
      try {
        const response = await fetch(url, {signal: controller.signal, cache:'no-store'});
        if (response.ok) return {kind:'public', label:'Truy cập được', detail:'Nền tảng cung cấp dữ liệu oEmbed công khai cho video này.'};
        if (response.status === 401 || response.status === 403)
          return {kind:'locked', label:'Bị hạn chế', detail:'Máy chủ từ chối truy cập (HTTP ' + response.status + '). Có thể là video riêng tư hoặc yêu cầu đăng nhập.'};
        if (response.status === 404 || response.status === 410)
          return {kind:'broken', label:'Không tìm thấy', detail:'Không nhận được video qua oEmbed (HTTP ' + response.status + '). Có thể đã xóa hoặc không cho nhúng.'};
        return {kind:'unknown', label:'Chưa xác minh', detail:'Nền tảng phản hồi HTTP ' + response.status + ', chưa thể kết luận quyền truy cập.'};
      } catch (err) {
        return {kind:'unknown', label:'Chưa xác minh', detail:'Trình duyệt không đọc được phản hồi (CORS / mạng / giới hạn truy cập). Không kết luận là bị khóa.'};
      } finally { clearTimeout(timer); }
    };

    // JSONP qua Google Apps Script đã triển khai. Chỉ cho phép URL từ script.google.com.
    const checkDriveWithScript = (endpoint, link) => new Promise(resolve => {
      let endpointUrl;
      try {
        endpointUrl = new URL(endpoint);
        if (endpointUrl.protocol !== 'https:' || endpointUrl.hostname !== 'script.google.com' || !/^\/macros\/s\/[^/]+\/exec$/.test(endpointUrl.pathname))
          throw new Error('Endpoint không phải Apps Script Web App hợp lệ.');
      } catch (err) { resolve({kind:'unknown', label:'Chưa xác minh', detail:err.message}); return; }
      const callback = '__vptcCheck_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      let done = false;
      const cleanup = (result) => {
        if (done) return;
        done = true;
        delete window[callback];
        script.remove();
        clearTimeout(timeout);
        resolve(result);
      };
      const timeout = setTimeout(() => cleanup({kind:'unknown', label:'Hết thời gian', detail:'Google Apps Script không trả kết quả trong 15 giây.'}),15000);
      window[callback] = res => {
        const kinds = new Set(['public','locked','broken','unknown','invalid']);
        cleanup({kind:kinds.has(res?.kind) ? res.kind : 'unknown', label:String(res?.label || 'Chưa xác minh'), detail:String(res?.detail || '')});
      };
      endpointUrl.searchParams.set('url', link);
      endpointUrl.searchParams.set('callback', callback);
      script.src = endpointUrl.toString();
      script.onerror = () => cleanup({kind:'unknown', label:'Không kết nối', detail:'Không tải được dịch vụ Google Apps Script.'});
      document.head.appendChild(script);
    });

    function App() {
      const [data, setData] = useState([]);
      const [sheetUrl, setSheetUrl] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      
      // Range states
      const [rangeFrom, setRangeFrom] = useState(1);
      const [rangeTo, setRangeTo] = useState(100);
      
      // View mode: 'links' | 'posts'
      const [viewMode, setViewMode] = useState('links');
      
      // Post Template States
      const [template, setTemplate] = useState(
`🌟🎹 BÀI DỰ THI ONLINE – VIETNAM PIANO TALENT COMPETITION 2027 🎹🌟
⭐️ Số báo danh: {SBD}
⭐️ Thí sinh: {TEN} - {TINH}
⭐️ Bảng thi: {BANG} - {NHOM}
🎼 Tác phẩm dự thi: {TACPHAM}

Hãy cùng thưởng thức phần trình diễn của {TEN} tại Vòng thi Online – Vietnam Piano Talent Competition 2027!

Mỗi giai điệu là một câu chuyện, mỗi phần trình diễn là một sắc màu riêng biệt. Cảm ơn bạn đã mang đến cuộc thi phần thể hiện đầy tâm huyết và chúc bạn sẽ có một hành trình thật nhiều cảm xúc, tự tin tỏa sáng và chinh phục những cột mốc mới cùng VPTC 2027! ❤️🎹

🌈 PLAY YOUR COLORS – Mỗi tài năng, Một sắc màu!
Hãy cùng theo dõi, cổ vũ và lan tỏa tình yêu Piano nhé! 🥰
---
🎹 CUỘC THI TÌM KIẾM TÀI NĂNG PIANO VIỆT NAM
VIETNAM PIANO TALENT COMPETITION 2027
📞 Hotline: 093 113 99 69
📧 Email: vietnampianotalent@gmail.com
🌐 Website: https://pianotalent.org/
📝 Registration: https://register.pianotalent.org/
#VietnamPianoTalentCompetition #VPTC2027 #PlayYourColors #OnlineCompetition #PianoTalent`);

      const [appliedTemplate, setAppliedTemplate] = useState(template);
      const [searchText, setSearchText] = useState('');
      const [isApplying, setIsApplying] = useState(false);
      const [applyProgress, setApplyProgress] = useState(0);
      const [postCache, setPostCache] = useState({});
      const [postPage, setPostPage] = useState(1);
      // Cập nhật bản kiểm tra từ khóa khi dừng gõ, không xử lý 991 bài khi nhập.
      const [previewTemplate, setPreviewTemplate] = useState(template);
      const [templateErrors, setTemplateErrors] = useState([]);
      const [applyNotice, setApplyNotice] = useState('');
      const [inputMode, setInputMode] = useState('excel');
      const [dragging, setDragging] = useState(false);
      const [linkFilter, setLinkFilter] = useState('all');
      const [linksPage, setLinksPage] = useState(1);
      const [checkResults, setCheckResults] = useState({});
      const [checking, setChecking] = useState(false);
      const [checkProgress, setCheckProgress] = useState({done:0, total:0});
      const [checkSummary, setCheckSummary] = useState('');
      const [checkerEndpoint, setCheckerEndpoint] = useState(() => {
        try { return localStorage.getItem('vptc_drive_checker_url') || ''; } catch (_) { return ''; }
      });
      const [editorSelection, setEditorSelection] = useState(0);
      const editorComposing = useRef(false);
      const editorRef = useRef(null);
      const editorCursor = useRef(0);
      const [keywords, setKeywords] = useState(['{TEN}', '{SBD}', '{TINH}', '{NHOM}', '{BANG}', '{TACPHAM}', '{LINK}']);
      // Các khóa có nguồn thực sự trong file Excel, thay vì các khóa thêm tay.
      const [excelAvailableKeys, setExcelAvailableKeys] = useState([]);
      const [newKeyword, setNewKeyword] = useState('');
      
      const [editingRowId, setEditingRowId] = useState(null);
      const [editLinkValue, setEditLinkValue] = useState('');
      const templateRef = useRef(null);
      const validExcelKeys = useMemo(() => new Set(excelAvailableKeys.map(key => normalizeKeyStatic(key))), [excelAvailableKeys]);

      const keywordTokens = (text) => [...new Set((String(text).match(/\{[^{}\n]+\}/g) || []))];
      const findInvalidKeywords = (text) => keywordTokens(text).filter(token =>
        !validExcelKeys.has(normalizeKeyStatic(token.slice(1, -1)))
      );
      const invalidPreviewKeys = useMemo(() => new Set(findInvalidKeywords(previewTemplate)), [previewTemplate, validExcelKeys]);
      const linkStates = useMemo(() => {
        const map = new Map();
        data.forEach(item => map.set(item.id, baseLinkProblem(item) || checkResults[item.id] || null));
        return map;
      }, [data, checkResults]);
      const getRowCheck = item => linkStates.get(item.id) || null;
      const rowHasWarning = item => checkResultIsIssue(getRowCheck(item));

      useEffect(() => {
        const task = setTimeout(() => {
          setPreviewTemplate(template);
          setTemplateErrors(findInvalidKeywords(template));
        }, 350);
        return () => clearTimeout(task);
      }, [template, validExcelKeys]);

      useEffect(() => {
        document.querySelectorAll('.auto-resize-textarea').forEach(el => {
          el.style.height = 'auto';
          el.style.height = Math.min(el.scrollHeight, 600) + 'px';
        });
      }, [viewMode, postPage, postCache]);

      // HÀM CHUẨN HÓA CHỮ (Xóa dấu, khoảng trắng, viết hoa)
      const normalizeKey = (str) => {
        if (!str) return "";
        return String(str)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "") // Xóa dấu tiếng Việt
          .replace(/[^a-zA-Z0-9]/g, "")    // Xóa ký tự đặc biệt và khoảng trắng
          .toUpperCase();                  // Viết hoa
      };

      // HÀM RÚT GỌN TỈNH/THÀNH PHỐ
      const processProvince = (str) => {
        if (!str) return "";
        let parts = str.split(/[-,]/);
        let lastPart = parts[parts.length - 1].trim().toUpperCase();
        lastPart = lastPart.replace(/^(TỈNH|THÀNH PHỐ|TP\.?)\s+/i, "");
        if (lastPart === "HỒ CHÍ MINH" || lastPart.includes("HCM")) return "TP HCM";
        return lastPart;
      };

      // BỘ QUÉT EXCEL THÔNG MINH
      const parseExcelData = (data2DArray) => {
        let headerRowIndex = -1;
        let bestScore = 0;
        let detectedHeaders = [];

        // 1. Quét 10 dòng đầu để tìm dòng chứa tiêu đề
        for (let i = 0; i < Math.min(10, data2DArray.length); i++) {
          const row = data2DArray[i];
          if (!row || row.length === 0) continue;

          let score = 0;
          const normRow = row.map(cell => normalizeKey(cell));

          if (normRow.includes("STT")) score += 2;
          if (normRow.some(h => h.includes("SBD") || h.includes("SOBAODANH"))) score += 2;
          if (normRow.some(h => h.includes("TEN") || h.includes("HOTEN") || h.includes("THISINH"))) score += 2;
          if (normRow.some(h => h.includes("LINK") || h.includes("VIDEO"))) score += 2;
          if (normRow.some(h => h.includes("TINH"))) score += 1;
          if (normRow.some(h => h.includes("TACPHAM"))) score += 1;

          if (score > bestScore && score >= 2) {
            bestScore = score;
            headerRowIndex = i;
            detectedHeaders = normRow;
          }
        }

        if (headerRowIndex === -1) {
          headerRowIndex = 0;
          detectedHeaders = (data2DArray[0] || []).map(c => normalizeKey(c));
        }

        const sourceNames = detectedHeaders.filter(Boolean);
        const exists = predicate => sourceNames.some(predicate);
        const hasSbd = exists(h => h.includes('SBD') || h.includes('SOBAODANH'));
        const computedAliases = [
          ...(hasSbd ? ['SBD', 'NHOM', 'BANG'] : []),
          ...(exists(h => h.includes('TEN') || h.includes('HOTEN') || h.includes('THISINH')) ? ['TEN'] : []),
          ...(exists(h => h.includes('TINH')) ? ['TINH'] : []),
          ...(exists(h => h.includes('TACPHAM') || h.includes('BAI')) ? ['TACPHAM'] : []),
          ...(exists(h => h.includes('LINK') || h.includes('VIDEO')) ? ['LINK'] : [])
        ];
        const matchedColumnKeys = Array.from(new Set([...sourceNames, ...computedAliases]));
        setExcelAvailableKeys(matchedColumnKeys);
        setKeywords(matchedColumnKeys.map(key => `{${key}}`));

        const parsedRows = [];
        let sttCounter = 1;

        // 2. Đọc dữ liệu từ dòng dưới dòng tiêu đề
        for (let i = headerRowIndex + 1; i < data2DArray.length; i++) {
          const row = data2DArray[i];
          if (!row || row.length === 0 || row.every(cell => !cell || String(cell).trim() === '')) continue;

          const rowData = {};
          detectedHeaders.forEach((normHeader, index) => {
            if (normHeader) rowData[normHeader] = row[index] || "";
          });

          const sbdKey = detectedHeaders.find(h => h.includes("SBD") || h.includes("SOBAODANH"));
          const nameKey = detectedHeaders.find(h => h.includes("TEN") || h.includes("HOTEN") || h.includes("THISINH"));
          const linkKey = detectedHeaders.find(h => h.includes("LINK") || h.includes("VIDEO"));
          const tinhKey = detectedHeaders.find(h => h.includes("TINH"));
          const tacPhamKey = detectedHeaders.find(h => h.includes("TACPHAM") || h.includes("BAI"));

          const sbd = sbdKey ? String(rowData[sbdKey]).trim() : "";
          const name = nameKey ? String(rowData[nameKey]).trim() : "";
          let link = linkKey ? String(rowData[linkKey]).trim() : "";
          
          if(name === "#REF!" || name === "undefined") continue;

          let group = "";
          let board = "";
          let sbdUpper = sbd.toUpperCase();

          if (sbdUpper.startsWith("B")) { group = "Nhóm Không Chuyên"; board = "Bảng B"; }
          else if (sbdUpper.startsWith("PA")) { group = "Nhóm Chuyên Nghiệp Cổ Điển"; board = "Bảng A"; }
          else if (sbdUpper.startsWith("NA")) { group = "Nhóm Chuyên Nghiệp Nhạc Nhẹ"; board = "Bảng A"; }
          else if (sbdUpper.startsWith("CY")) { group = "Nhóm Song Tấu Chuyên Nghiệp"; board = "Bảng Young"; }
          else if (sbdUpper.startsWith("CA")) { group = "Nhóm Song Tấu Chuyên Nghiệp"; board = "Bảng Adult"; }
          else if (sbdUpper.startsWith("DY")) { group = "Nhóm Song Tấu Không Chuyên"; board = "Bảng Young"; }
          else if (sbdUpper.startsWith("DA")) { group = "Nhóm Song Tấu Không Chuyên"; board = "Bảng Adult"; }
          else if (sbdUpper.startsWith("A")) { group = "Nhóm Không Chuyên"; board = "Bảng A"; }
          else if (sbdUpper.startsWith("C")) { group = "Nhóm Không Chuyên"; board = "Bảng C"; }
          else if (sbdUpper.startsWith("D")) { group = "Nhóm Không Chuyên"; board = "Bảng D"; }
          else if (sbdUpper.startsWith("E")) { group = "Nhóm Không Chuyên"; board = "Bảng E"; }
          else if (sbdUpper.startsWith("F")) { group = "Nhóm Không Chuyên"; board = "Bảng F"; }

          const formattedStt = String(sttCounter).padStart(4, '0');

          let fileName = `${formattedStt} - `;
          if (name) fileName += `${name.toUpperCase()} - `;
          if (sbd) fileName += `SBD ${sbdUpper} - `;
          if (group) fileName += `${group} - `;
          if (board) fileName += `${board}`;
          fileName = fileName.replace(/ - $/, "");

          rowData["TEN"] = name;
          rowData["SBD"] = sbd;
          rowData["NHOM"] = group;
          rowData["BANG"] = board;
          rowData["TINH"] = tinhKey ? String(rowData[tinhKey]).trim() : "";
          rowData["TACPHAM"] = tacPhamKey ? String(rowData[tacPhamKey]).trim() : "";
          rowData["LINK"] = link;

          let status = 'success';
          if (!link) status = 'missing_link';
          else if (link.includes('/folders/')) status = 'folder_error';

          parsedRows.push({
            id: sttCounter,
            stt: formattedStt,
            sbd: sbd,
            originalName: name,
            fileName: fileName,
            link: link,
            status: status,
            dynamicData: rowData
          });

          sttCounter++;
        }
        
        setPostCache({});
        setApplyNotice('');
        setPostPage(1);
        setData(parsedRows);
        setCheckResults({});
        setLinkFilter('all');
        setCheckSummary('');
        setCheckProgress({done:0,total:0});
        setRangeTo(parsedRows.length > 0 ? parsedRows.length : 100);
      };

      const loadGoogleSheet = async () => {
        if (!sheetUrl) return;
        setIsLoading(true);
        setErrorMsg('');
        try {
          const match = sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
          if (!match) throw new Error("Link Google Sheets không hợp lệ.");
          const sheetId = match[1];
          const exportUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=xlsx`;
          
          const response = await fetch(exportUrl);
          const arrayBuffer = await response.arrayBuffer();
          const workbook = XLSX.read(arrayBuffer, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const data2D = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
          
          parseExcelData(data2D);
        } catch (err) {
          setErrorMsg('Không thể nạp dữ liệu. Hãy đảm bảo link đã bật "Bất kỳ ai có liên kết"');
        }
        setIsLoading(false);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsLoading(true);
        const reader = new FileReader();
        reader.onload = (evt) => {
          const bstr = evt.target.result;
          const workbook = XLSX.read(bstr, { type: 'binary' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const data2D = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
          parseExcelData(data2D);
          setIsLoading(false);
        };
        reader.readAsBinaryString(file);
      };

      const copyToClipboard = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
        } catch (err) {}
        document.body.removeChild(textArea);
      };

      const openDownloader = (link, type) => {
        copyToClipboard(link);
        if(type === 'yt') window.open('https://ytsave.to/vi2/', '_blank');
        if(type === 'tiktok') window.open('https://tikdown.com/vi/', '_blank');
        if(type === 'fb') window.open('https://fsave.net/vi', '_blank');
      };

      // Khớp từ khóa với cột Excel; cho phép {HO_TEN} và {HOTEN} cùng chỉ đến cột Họ tên.
      const buildPost = (source, item) => String(source).replace(/\{([^{}\n]+)\}/g, (token, rawName) => {
        const key = normalizeKeyStatic(rawName);
        const rowData = item.dynamicData || {};
        const exact = Object.prototype.hasOwnProperty.call(rowData, key) ? rowData[key] : undefined;
        if (exact === undefined || exact === null) return token;
        return (key === 'TINH' || key === 'TINHTHANH')
          ? processProvince(String(exact)) : String(exact);
      });
      const generatePostContent = item => postCache[item.id] ?? buildPost(appliedTemplate, item);

                      <div className="flex justify-between items-center gap-3">
                        <span className="font-bold text-slate-700"><Icon name="highlighter" className="mr-1 text-indigo-500" /> Kiểm tra từ khóa trong Content</span>
                        {templateErrors.length ? <span className="text-red-700 font-bold">{templateErrors.length} từ khóa sai</span> : <span className="text-emerald-700 font-semibold"><Icon name="circle-check" /> Hợp lệ</span>}
                      </div>
                      {!!templateErrors.length && <div className="mt-2 text-red-700">Không khớp Excel: {templateErrors.map(k=><span key={k} className="inline-block mx-1 bg-red-100 border border-red-200 px-1 rounded">{k}</span>)}</div>}
                      <p className="mt-2 text-slate-500">Chỉ tô màu từ khóa trong ô soạn thảo. Dữ liệu của tất cả bài viết chỉ được tạo lại sau khi bấm Áp dụng toàn bộ.</p>
                    </div>
                  </div>
                </div>
              )}

              {viewMode === 'links' && (
                <div className="bg-amber-50 p-6 rounded-2xl border border-amber-200 shadow-sm text-sm text-amber-900">
                  <h3 className="font-bold flex items-center gap-2 mb-4 text-amber-800">
                    <Icon name="circle-info" className="mr-2" /> Hướng dẫn sử dụng 4 bước
                  </h3>
                  <div className="flex gap-3 mb-4">
                    <span className="bg-amber-200 w-6 h-6 flex items-center justify-center rounded-full font-bold text-amber-800 shrink-0">1</span>
                    <p>Nạp dữ liệu bằng link <b>Google Sheets</b> hoặc upload file <b>Excel</b>.</p>
                  </div>
                  <div className="flex gap-3 mb-4">
                    <span className="bg-amber-200 w-6 h-6 flex items-center justify-center rounded-full font-bold text-amber-800 shrink-0">2</span>
                    <p>Chỉnh khoảng <b>STT Từ - Đến</b> để chọn số lượng thí sinh muốn xuất.</p>
                  </div>
                  <div className="flex gap-3 mb-4">
                    <span className="bg-amber-200 w-6 h-6 flex items-center justify-center rounded-full font-bold text-amber-800 shrink-0">3</span>
                    <p>Bấm nút <b>Xuất File Google Colab</b> ở dưới cùng để tải kịch bản.</p>
                  </div>
                  <div className="flex gap-3">
                    <span className="bg-amber-200 w-6 h-6 flex items-center justify-center rounded-full font-bold text-amber-800 shrink-0">4</span>
                    <p>Mở <a href="https://colab.research.google.com" target="_blank" rel="noreferrer" className="text-blue-600 font-bold hover:underline">Google Colab</a>, tải file lên và ấn nút Run.</p>
                  </div>
                </div>
              )}
            </div>

            <div className="w-full md:w-[67%] bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[650px]">
              <div className="bg-slate-50 p-4 border-b border-slate-200 flex justify-between items-center">
                {viewMode === 'links' ? (
                  <div className="relative"><Icon name="magnifying-glass" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" /><input type="text" value={searchText} onChange={e => setSearchText(e.target.value)} placeholder="Tìm tên hoặc SBD..." className="pl-9 pr-4 py-2 border border-slate-300 rounded-full text-sm outline-none w-64 focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500" /></div>
                ) : (
                  <button onClick={() => setViewMode('links')} className="flex items-center gap-2 text-slate-600 font-medium hover:text-slate-900">
                    <Icon name="arrow-left" className="mr-1" /> Quay lại Quản lý Link
                  </button>
                )}
                
                <div className="flex items-center gap-3">
                  {viewMode==='links'&&<button onClick={checkAllLinks} disabled={checking||!data.length} className="rounded-lg border border-blue-200 bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-2 disabled:opacity-50"><Icon name={checking ? 'spinner':'shield-halved'} className={checking?'fa-spin mr-1':'mr-1'} />{checking ? `${checkProgress.done}/${checkProgress.total}` : 'Check Link'}</button>}
                  <span className="text-sm font-semibold text-slate-600">Khoảng xuất:</span>
                  <input type="number" value={rangeFrom} onChange={e => setRangeFrom(Number(e.target.value))} className="w-16 px-2 py-1 border border-slate-300 rounded text-center text-sm" />
                  <span>-</span>
                  <input type="number" value={rangeTo} onChange={e => setRangeTo(Number(e.target.value))} className="w-16 px-2 py-1 border border-slate-300 rounded text-center text-sm" />
                </div>
              </div>

              {viewMode === 'links' && <div className="px-4 py-2 bg-blue-50/60 border-b border-blue-100 flex flex-wrap items-center justify-between gap-2 text-xs">
                <span className="text-blue-700 font-semibold"><Icon name="filter" className="mr-1" />{activeFilterName}: {filteredRows.length} kết quả
                  {linkFilter!=='all' && <button onClick={()=>setLinkFilter('all')} className="ml-2 text-blue-600 underline">Xóa bộ lọc</button>}
                </span>
                <span className="text-slate-600" title={checkSummary}>{checking ? `Đang kiểm tra ${checkProgress.done}/${checkProgress.total}` : checkSummary}</span>
                {checking && <div className="w-full bg-blue-100 h-1 rounded-full overflow-hidden"><div className="h-full bg-blue-600 transition-all" style={{width:`${checkProgress.total ? checkProgress.done*100/checkProgress.total : 0}%`}} /></div>}
              </div>}
              {viewMode === 'links' && filteredRows.length>0 && <div className="px-4 py-2 text-xs text-slate-600 border-b border-slate-100 flex items-center justify-between gap-2">
                 <span>Hiển thị {(activeLinksPage-1)*linksPerPage+1}–{Math.min(activeLinksPage*linksPerPage,filteredRows.length)} / {filteredRows.length} kết quả</span>
                 <div className="flex items-center gap-2">
                   <button className="border rounded px-2 py-1 disabled:opacity-40" disabled={activeLinksPage===1} onClick={()=>setLinksPage(p=>Math.max(1,p-1))}><Icon name="chevron-left" /></button>
                   <span>Trang {activeLinksPage}/{linksTotalPages}</span>
                   <button className="border rounded px-2 py-1 disabled:opacity-40" disabled={activeLinksPage===linksTotalPages} onClick={()=>setLinksPage(p=>Math.min(linksTotalPages,p+1))}><Icon name="chevron-right" /></button>
                 </div>
              </div>}
              <div className="flex-1 overflow-y-auto p-0">
                {viewMode === 'links' ? (
                  <table className="w-full text-sm text-left">
                    <thead className="bg-white sticky top-0 z-10 text-xs text-slate-500 font-bold uppercase border-b border-slate-200 shadow-sm">
                      <tr>
                        <th className="px-6 py-4">STT</th>
                        <th className="px-6 py-4">TÊN FILE SẼ LƯU (ĐÃ AI CHUẨN HÓA)</th>
                        <th className="px-4 py-4">LINK VIDEO</th>
                        <th className="px-3 py-4">QUYỀN TRUY CẬP</th>
                      </tr>
                    </thead>
                    <tbody>
                      {visibleLinkRows.map((item) => {
                        const isOutOfRange = item.id < rangeFrom || item.id > rangeTo;
                        return (
                          <tr key={item.id} className={`border-b border-slate-100 hover:bg-slate-50 transition-all duration-300 ${isOutOfRange ? 'opacity-40 grayscale bg-slate-50/50' : 'bg-white'}`}>
                            <td className="px-6 py-4 font-mono font-bold text-slate-400">{item.stt}</td>
                            <td className="px-6 py-4 font-semibold text-teal-800">{item.fileName}</td>
                            <td className="px-6 py-4">
                              {editingRowId === item.id ? (
                                <input 
                                  autoFocus
                                  type="text" 
                                  className="border border-blue-400 rounded px-2 py-1 w-full text-xs outline-none"
                                  value={editLinkValue}
                                  onChange={e => setEditLinkValue(e.target.value)}
                                  onKeyDown={e => {
                                    if (e.key === 'Enter') updateItemLink(item, editLinkValue);
                                  }}
                                  onBlur={() => updateItemLink(item, editLinkValue)}
                                />
                              ) : (
                                <div className="flex items-center gap-2 group relative">
                                  {getRowCheck(item)?.kind==='missing' && <span className="text-amber-500 bg-amber-50 px-2 py-1 rounded text-xs font-medium italic border border-amber-200">(Chưa có link)</span>}
                                  {getRowCheck(item)?.kind==='invalid' && <span title={getRowCheck(item).detail} className="text-red-600 bg-red-50 px-2 py-1 rounded text-xs font-medium border border-red-200 truncate w-48 block">{getRowCheck(item).label}: {item.link}</span>}
                                  {!baseLinkProblem(item) && <span className="text-blue-600 truncate w-48 block text-xs">{item.link}</span>}
                                  
                                  <button onClick={() => { setEditingRowId(item.id); setEditLinkValue(item.link); }} className="text-slate-300 hover:text-blue-600 opacity-0 group-hover:opacity-100 transition">
                                    <Icon name="pen-to-square" />
                                  </button>

                                  {item.link && (item.link.includes('youtu') || item.link.includes('tiktok') || item.link.includes('fb') || item.link.includes('facebook')) && (
                                    <button 
                                      onClick={() => openDownloader(item.link, item.link.includes('youtu') ? 'yt' : (item.link.includes('tiktok') ? 'tiktok' : 'fb'))}
                                      className={`px-3 py-1 rounded-full text-xs font-bold shadow-sm ${item.link.includes('youtu') ? 'bg-red-50 text-red-600 border border-red-100 hover:bg-red-100' : (item.link.includes('tiktok') ? 'bg-slate-800 text-white hover:bg-black' : 'bg-blue-50 text-blue-700 border border-blue-100 hover:bg-blue-100')}`}
                                    >
                                      <><Icon name={item.link.includes('youtu') ? 'youtube' : (item.link.includes('tiktok') ? 'tiktok' : 'facebook')} brand className="mr-1" />{item.link.includes('youtu') ? 'YTSave' : (item.link.includes('tiktok') ? 'TikDown' : 'FSave')}</>
                                    </button>
                                  )}
                                </div>
                              )}
                            </td>
                            <td className="px-3 py-4 align-middle">
                              {getRowCheck(item) ? <span title={getRowCheck(item).detail} className={`inline-flex items-center gap-1 text-[11px] font-bold rounded-full px-2 py-1 whitespace-nowrap ${getRowCheck(item).kind==='public'?'bg-emerald-50 text-emerald-700 border border-emerald-200':checkResultIsIssue(getRowCheck(item))?'bg-amber-50 text-amber-700 border border-amber-200':'bg-slate-100 text-slate-600 border border-slate-200'}`}>
                                <Icon name={getRowCheck(item).kind==='public'?'circle-check':checkResultIsIssue(getRowCheck(item))?'triangle-exclamation':'circle-question'} />{getRowCheck(item).label}
                              </span> : <span className="text-[11px] text-slate-400">Chưa kiểm tra</span>}
                            </td>
                          </tr>
                      )})}
                      {filteredRows.length===0 && <tr><td colSpan="4" className="text-center text-sm text-slate-500 py-12">Không có kết quả phù hợp bộ lọc. <button className="text-blue-600 underline" onClick={()=>{setLinkFilter('all');setSearchText('')}}>Xem toàn bộ</button></td></tr>}
                    </tbody>
                  </table>
                ) : (
                  <div className="p-6 space-y-8 bg-slate-50/50">
                    {data.filter(d => d.id >= rangeFrom && d.id <= rangeTo).slice((postPage-1)*12,postPage*12).map((item) => (
                      <div key={item.id} className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <div className="bg-indigo-50/50 px-4 py-3 border-b border-slate-100 flex justify-between items-center">
                          <div className="flex items-center gap-3">
                            <span className="bg-indigo-100 text-indigo-800 font-bold px-2 py-1 rounded text-xs">STT {item.stt}</span>
                            <span className="font-bold text-slate-800 uppercase">{item.originalName}</span>
                          </div>
                          <button 
                            onClick={() => copyToClipboard(generatePostContent(item))}
                            className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg text-sm font-semibold shadow-sm transition flex items-center gap-2"
                          >
                            <Icon name="copy" className="mr-1" /> Copy nội dung
                          </button>
                        </div>
                        <div className="p-4">
                          <textarea
                            readOnly
                            value={generatePostContent(item)}
                            className="w-full text-slate-700 text-sm font-sans outline-none resize-none bg-transparent auto-resize-textarea"
                            style={{ minHeight: '150px' }}
                          />
                        </div>
                      </div>
                    ))}
                    <div className="flex justify-center items-center gap-3 py-4 text-sm">
                      <button disabled={postPage===1} onClick={()=>setPostPage(p=>p-1)} className="px-3 py-2 border bg-white rounded-lg disabled:opacity-40"><Icon name="chevron-left" className="mr-1" /> Trước</button>
                      Trang {postPage} / {Math.max(1,Math.ceil(data.filter(d=>d.id>=rangeFrom&&d.id<=rangeTo).length/12))}
                      <button disabled={postPage>=Math.ceil(data.filter(d=>d.id>=rangeFrom&&d.id<=rangeTo).length/12)} onClick={()=>setPostPage(p=>p+1)} className="px-3 py-2 border bg-white rounded-lg disabled:opacity-40">Sau <Icon name="chevron-right" className="ml-1" /></button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* FOOTER ACTIONS */}
          <div className="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 p-4 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] z-50 flex flex-wrap justify-center gap-2 sm:gap-4 max-h-[35vh] overflow-y-auto">
            {viewMode === 'links' ? (
              <>
                <button onClick={() => openBulkDownloader('yt')} className="bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 font-bold py-3 px-6 rounded-xl transition flex items-center gap-2">
                  <Icon name="youtube" brand className="mr-1" /> Mở YTSave ({data.filter(d => d.id >= rangeFrom && d.id <= rangeTo && d.link?.includes('youtu')).length})
                </button>
                <button onClick={() => openBulkDownloader('tiktok')} className="bg-slate-800 text-white hover:bg-black font-bold py-3 px-6 rounded-xl transition flex items-center gap-2">
                  <Icon name="tiktok" brand className="mr-1" /> TikDown ({data.filter(d => d.id >= rangeFrom && d.id <= rangeTo && d.link?.includes('tiktok')).length})
                </button>
                <button onClick={() => openBulkDownloader('fb')} className="bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 font-bold py-3 px-6 rounded-xl transition flex items-center gap-2">
                  <Icon name="facebook" brand className="mr-1" /> FSave ({data.filter(d => d.id >= rangeFrom && d.id <= rangeTo && (d.link?.includes('fb') || d.link?.includes('facebook'))).length})
                </button>
                <button onClick={() => setViewMode('posts')} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition flex items-center gap-2">
                  <Icon name="file-lines" className="mr-1" /> Bài Đăng FB ({rangeTo - rangeFrom + 1})
                </button>
                <button onClick={exportColab} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition flex items-center gap-2 ml-4">
                  <Icon name="download" className="mr-1" /> Xuất File Colab ({rangeTo - rangeFrom + 1})
                </button>
              </>
            ) : (
              <button onClick={() => setViewMode('links')} className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-10 rounded-xl shadow-lg transition">
                <Icon name="arrow-left" className="mr-1" /> Đóng & Quay Lại
              </button>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
